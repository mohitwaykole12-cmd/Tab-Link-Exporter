<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Tab Link Exporter</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #ffffff;
      --surface: #f8fafc;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .header h2 {
      font-size: 16px;
      font-weight: 700;
    }

    .badge {
      background: #eff6ff;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .search-box {
      margin-bottom: 10px;
    }

    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      background: var(--surface);
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .selection-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .selection-bar label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .tab-list {
      list-style: none;
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .tab-item:last-child {
      border-bottom: none;
    }

    .tab-item:hover {
      background: var(--surface);
    }

    .tab-fav {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 2px;
    }

    .tab-info {
      flex: 1;
      min-width: 0;
    }

    .tab-title {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-url {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .close-btn:hover {
      color: var(--danger);
      background: #fee2e2;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #e2e8f0;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div class="header">
    <h2>Tab Exporter</h2>
    <span id="tabCountBadge" class="badge">0 Tabs</span>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Filter tabs by title or domain...">
  </div>

  <div class="selection-bar">
    <label>
      <input type="checkbox" id="selectAllCheckbox" checked>
      <span>Select All</span>
    </label>
    <span id="selectedCountText">0 selected</span>
  </div>

  <ul id="tabList" class="tab-list"></ul>

  <div class="actions-grid">
    <button id="exportDocBtn" class="btn btn-primary">📄 Export Doc</button>
    <button id="exportCsvBtn" class="btn">📊 Export CSV</button>
    <button id="copyMdBtn" class="btn">📋 Copy MD</button>
  </div>

  <div id="toast" class="toast">Copied to clipboard!</div>

  <script src="popup.js"></script>
</body>

</html>
